name: Docker placeholder smoke
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placeholder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Start placeholder stack
        run: docker compose up -d
      - name: Verify health, page and styles
        run: |
          set -eu
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health | grep -qx ok; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Design vergleichen'
          curl -fsS http://127.0.0.1:8080/styles.css | grep -q 'prefers-reduced-motion'
          docker compose ps
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop disposable stack
        if: always()
        run: docker compose down --remove-orphans
