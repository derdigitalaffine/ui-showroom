services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ui-showroom:local
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    profiles: [proxy]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CADDY_SITE: ${CADDY_SITE:-http://localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
